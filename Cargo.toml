[package]
name = "PushMC"
version = "2.0.0"
edition = "2024"

[[bin]]
name = "pushmc"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
which = "8.0.6"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
winresource = "0.1"